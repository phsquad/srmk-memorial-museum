<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лидерборд и Достижения | Мемориальный комплекс СРМК</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        :root {
            --primary: #c0392b;
            --secondary: #2c3e50;
            --accent: #f1c40f;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--secondary);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h1 { margin: 0; font-size: 2.5rem; }
        p.subtitle { opacity: 0.9; margin-top: 10px; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .card:hover { transform: translateY(-3px); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: bold;
            margin: 0;
        }

        /* Таблица лидерборда */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table th {
            text-align: left;
            padding: 12px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .leaderboard-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .rank-badge {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            border-radius: 50%;
            background: #eee;
            font-weight: bold;
            color: var(--secondary);
        }

        .rank-1 { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent); }
        .rank-2 { background: #bdc3c7; color: #fff; }
        .rank-3 { background: #cd7f32; color: #fff; }

        /* Сетка достижений */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
        }

        .achievement-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .achievement-item.unlocked {
            border-color: var(--accent);
            background: #fffbe6;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .achievement-item.locked {
            opacity: 0.5;
            filter: grayscale(100%);
        }

        .ach-icon { font-size: 2.5rem; display: block; margin-bottom: 5px; }
        .ach-title { font-size: 0.8rem; font-weight: bold; display: block; }
        .ach-desc { font-size: 0.7rem; color: #7f8c8d; display: block; margin-top: 2px; }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: none;
            background: #eee;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }
        
        .loading-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <h1>🏆 Зал Славы</h1>
        <p class="subtitle">Лучшие знатоки истории СРМК и героев Великой Отечественной войны</p>
    </div>
</header>

<div class="container">
    <div class="dashboard-grid">
        <!-- Левая колонка: Лидерборд -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Топ игроков</h2>
                <div class="filters">
                    <button class="filter-btn active" data-period="all">Все время</button>
                    <button class="filter-btn" data-period="week">Неделя</button>
                </div>
            </div>
            <div id="leaderboardContent">
                <div class="loading-state">Загрузка рейтинга...</div>
            </div>
            <a href="quiz.html" class="back-link">← Пройти тест заново</a>
        </div>

        <!-- Правая колонка: Достижения -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Мои достижения</h2>
                <span id="achievementCount" style="background:var(--accent); color:#000; padding:2px 8px; border-radius:10px; font-size:0.8rem;">0/5</span>
            </div>
            <div id="achievementsContent" class="achievements-grid">
                <div class="loading-state">Загрузка профиля...</div>
            </div>
            <p style="margin-top:20px; font-size:0.9rem; color:#7f8c8d;">
                💡 <i>Совет: Проходите квизы регулярно, чтобы открывать новые бейджи и подниматься в рейтинге!</i>
            </p>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://qtafcczydgyrganrpkof.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0YWZjY3p5ZGd5cmdhbnJwa29mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM3NzQxNzEsImV4cCI6MjA1OTM1MDE3MX0.N6f8tT8qGqQvJqJqJqJqJqJqJqJqJqJqJqJqJqJqJqJ'; // Замените на ваш реальный anon key если этот не работает
    
    // Используем тот же ключ, что и в основном приложении
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = localStorage.getItem('srmk_current_student') || 'Гость';

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        loadLeaderboard('all');
        loadAchievements();
        setupFilters();
    });

    function setupFilters() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                loadLeaderboard(e.target.dataset.period);
            });
        });
    }

    async function loadLeaderboard(period) {
        const container = document.getElementById('leaderboardContent');
        container.innerHTML = '<div class="loading-state">Обновление данных...</div>';

        let query = supabase
            .from('quiz_results')
            .select('student_name, score, completed_at')
            .order('score', { ascending: false })
            .order('completed_at', { ascending: true }) // Быстрее тот, кто раньше набрал такой же счет
            .limit(20);

        if (period === 'week') {
            const weekAgo = new Date();
            weekAgo.setDate(weekAgo.getDate() - 7);
            query = query.gte('completed_at', weekAgo.toISOString());
        }

        const { data, error } = await query;

        if (error) {
            container.innerHTML = `<div class="loading-state" style="color:red">Ошибка: ${error.message}</div>`;
            return;
        }

        if (!data || data.length === 0) {
            container.innerHTML = '<div class="loading-state">Пока нет результатов. Стань первым!</div>';
            return;
        }

        // Группировка по имени (берем лучший результат)
        const bestScores = {};
        data.forEach(row => {
            if (!bestScores[row.student_name] || row.score > bestScores[row.student_name].score) {
                bestScores[row.student_name] = row;
            }
        });

        const sortedLeaders = Object.values(bestScores).sort((a, b) => b.score - a.score).slice(0, 10);

        let html = `<table class="leaderboard-table">
            <thead><tr><th>#</th><th>Имя</th><th>Счет</th><th>Дата</th></tr></thead>
            <tbody>`;
        
        sortedLeaders.forEach((entry, index) => {
            const rankClass = index < 3 ? `rank-${index + 1}` : '';
            const date = new Date(entry.completed_at).toLocaleDateString('ru-RU');
            html += `
                <tr>
                    <td><span class="rank-badge ${rankClass}">${index + 1}</span></td>
                    <td><strong>${escapeHtml(entry.student_name)}</strong></td>
                    <td style="color:var(--primary); font-weight:bold">${entry.score}/10</td>
                    <td style="font-size:0.8rem; color:#7f8c8d">${date}</td>
                </tr>
            `;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    async function loadAchievements() {
        const container = document.getElementById('achievementsContent');
        const countLabel = document.getElementById('achievementCount');
        
        // 1. Загружаем все шаблоны
        const { data: templates } = await supabase.from('achievements_templates').select('*');
        
        if (!templates) {
            container.innerHTML = '<div class="loading-state">Нет данных о достижениях</div>';
            return;
        }

        // 2. Загружаем полученные достижения пользователя
        const { data: userAchs } = await supabase
            .from('user_achievements')
            .select('achievement_id')
            .eq('student_name', currentUser);

        const unlockedIds = new Set(userAchs ? userAchs.map(a => a.achievement_id) : []);

        // 3. Рендерим
        let html = '';
        let unlockedCount = 0;

        templates.forEach(ach => {
            const isUnlocked = unlockedIds.has(ach.id);
            if (isUnlocked) unlockedCount++;
            
            html += `
                <div class="achievement-item ${isUnlocked ? 'unlocked' : 'locked'}">
                    <span class="ach-icon">${ach.icon_url}</span>
                    <span class="ach-title">${ach.title}</span>
                    <span class="ach-desc">${ach.description}</span>
                </div>
            `;
        });

        container.innerHTML = html;
        countLabel.textContent = `${unlockedCount}/${templates.length}`;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
