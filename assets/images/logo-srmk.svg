<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c41e3a"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="400" height="200" fill="#f5f5f5"/>
  
  <!-- Щит -->
  <path d="M 200 20 L 360 60 L 360 140 L 200 180 L 40 140 L 40 60 Z" 
        fill="url(#logoGrad)" stroke="#333" stroke-width="3"/>
  
  <!-- Текст СРМК -->
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        fill="white" text-anchor="middle" dominant-baseline="middle">СРМК</text>
  
  <!-- Декоративная звезда -->
  <polygon points="200,50 210,75 235,75 215,90 225,115 200,100 175,115 185,90 165,75 190,75" 
