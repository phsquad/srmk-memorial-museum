<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Музей СРМК | Мобильное приложение</title>
  <meta name="theme-color" content="#0e1013">

  <!-- ОБРАТНЫЙ ШЛЮЗ ДЛЯ ПК -->
  <script>
    if (!/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) && window.innerWidth > 768) {
      window.location.replace('index.html' + window.location.hash);
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/mobile.css">
  
  <!-- Мобильные стили под большой палец -->
  <style>
    body { padding-bottom: 74px; }
    .header { padding: 12px 16px; position: fixed; width: 100%; top: 0; z-index: 1000; }
    .hero-section { padding: 80px 16px 36px; }
    .hero-title { font-size: 1.75rem; }
    
    /* Нижняя панель навигации (App Tab Bar) */
    .bottom-app-bar {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      background: rgba(14, 16, 19, 0.98);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-hairline);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 14px 0;
      z-index: 2000;
    }
    .app-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.68rem;
      gap: 3px;
      font-weight: 500;
    }
    .app-tab.active, .app-tab:active { color: var(--accent-brass); }
    .app-tab-icon svg { width: 20px; height: 20px; stroke: currentColor; }
    
    /* Модалка на весь экран телефона */
    .modal-dialog {
      width: 100%; height: 100%; max-height: 100vh;
      border-radius: 0; border: none; padding: 18px 16px 85px;
    }
    .dossier-layout { display: flex; flex-direction: column; gap: 18px; }
    .dossier-gallery-main { height: 280px; }
    .dossier-name { font-size: 1.35rem; }
  </style>
</head>
<body class="dark-theme">

  <!-- ШАПКА -->
  <header class="header">
    <div class="logo-group">
      <div class="logo-badge">СРМК</div>
      <div class="logo-text">
        <span class="site-title" style="font-size: 0.88rem;">«Быть воином — жить вечно»</span>
      </div>
    </div>
  </header>

  <main>
    <!-- ВВОДНЫЙ ЭКРАН -->
    <section class="hero-section" id="heroIntro">
      <h1 class="hero-title">ОНИ УЧИЛИСЬ ЗДЕСЬ.<br><span class="highlight">ОНИ ШАГНУЛИ В ВЕЧНОСТЬ.</span></h1>
      <p class="hero-subtitle" style="font-size: 0.88rem; margin-bottom: 24px;">Цифровой мемориал памяти 20 выпускников колледжа.</p>
      <button class="btn btn-primary" style="width: 100%;" id="btnOpenGeneralTour" type="button">Слушать аудиоэкскурсию</button>
    </section>

    <!-- ЗАЛ I: МЕМОРИАЛ -->
    <section id="memorial" class="section" style="padding: 40px 0;">
      <div class="container">
        <h2 class="section-title" style="font-size: 1.35rem; text-align: center;">Мемориал Славы</h2>
        <div class="plaque-view-toggle" style="margin-bottom: 16px;">
          <button class="plaque-toggle-btn active" data-plaque-view="left" type="button">Левая плита</button>
          <button class="plaque-toggle-btn" data-plaque-view="right" type="button">Правая плита</button>
        </div>
        <div class="memorial-stand-container" style="padding: 8px;">
          <div class="plaque-interactive-zone left-zone" id="leftPlaqueZone" style="width: 100%;">
            <div class="names-list" id="leftPlaqueNames"></div>
          </div>
          <div class="plaque-interactive-zone right-zone" id="rightPlaqueZone" style="width: 100%; display: none;">
            <div class="names-list" id="rightPlaqueNames"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ЗАЛ II: КАРТОЧКИ -->
    <section id="heroes-grid" class="section" style="padding: 40px 0;">
      <div class="container">
        <h2 class="section-title" style="font-size: 1.35rem; text-align: center;">За партой Героя</h2>
        <input type="text" id="heroSearchInput" class="search-input" placeholder="Поиск героя..." style="margin-bottom: 14px;">
        <div class="specialty-filters-bar" id="specialtyFiltersContainer"></div>
        <div class="heroes-grid" id="heroesCardsContainer" style="grid-template-columns: 1fr; gap: 16px;"></div>
      </div>
    </section>

    <!-- ЗАЛ III: КАРТА -->
    <section id="battle-path" class="section" style="padding: 40px 0;">
      <div class="container">
        <h2 class="section-title" style="font-size: 1.35rem; text-align: center;">Карта боев</h2>
        <div id="interactiveBattleMap" class="battle-map-wrapper" style="height: 360px;"></div>
      </div>
    </section>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО ДОСЬЕ -->
  <div class="modal" id="heroModal">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-dialog">
      <button class="modal-close" id="modalCloseBtn">&times;</button>
      <div class="modal-body" id="modalHeroContent"></div>
    </div>
  </div>

  <!-- АУДИОПЛЕЕР -->
  <div class="audio-bar" id="audioPlayerBar" style="bottom: 58px;">
    <div class="container audio-bar-inner">
      <button class="audio-btn" id="audioPlayPauseBtn">▶</button>
      <div class="audio-titles" style="flex-grow: 1; overflow: hidden;">
        <span class="audio-track-title" id="audioTrackTitle">Аудиогид</span>
        <span class="audio-hero-name" id="audioHeroName">СРМК</span>
      </div>
      <button class="audio-close" id="audioCloseBtn">&times;</button>
    </div>
    <audio id="mainAudioElement"></audio>
    <div class="audio-progress-container" id="audioProgressContainer" style="position: absolute; top: 0; left: 0; width: 100%; height: 3px;">
      <div class="audio-progress" id="audioProgressBar"></div>
    </div>
  </div>

  <!-- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ (APP TAB BAR) -->
  <nav class="bottom-app-bar">
    <a href="#memorial" class="app-tab active" onclick="setActiveTab(this)">
      <span class="app-tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 21h18M3 7v14M21 7v14M6 7v14M10 7v14M14 7v14M18 7v14M12 3L2 7h20L12 3z"/></svg>
      </span>
      <span>Мемориал</span>
    </a>
    <a href="#heroes-grid" class="app-tab" onclick="setActiveTab(this)">
      <span class="app-tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      </span>
      <span>Герои</span>
    </a>
    <a href="#battle-path" class="app-tab" onclick="setActiveTab(this)">
      <span class="app-tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
      </span>
      <span>Карта</span>
    </a>
    <a href="https://карта-доблести.рф" target="_blank" class="app-tab">
      <span class="app-tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      </span>
      <span>Проект</span>
    </a>
  </nav>

  <!-- СКРИПТЫ -->
  <script src="https://api-maps.yandex.ru/2.1/?apikey=ваш_ключ&lang=ru_RU" type="text/javascript"></script>
  <script src="js/data.js"></script>
  <script src="js/sources.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    function setActiveTab(el) {
      document.querySelectorAll('.app-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }

    document.querySelectorAll('.plaque-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.plaque-toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const view = btn.dataset.plaqueView;
        document.getElementById('leftPlaqueZone').style.display = view === 'left' ? 'block' : 'none';
        document.getElementById('rightPlaqueZone').style.display = view === 'right' ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
