<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Блокируем масштабирование для ощущения нативного приложения -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Музей СРМК | Мобильная версия</title>
  <meta name="theme-color" content="#0a0c10">

  <!-- ОБРАТНЫЙ РЕДИРЕКТ ДЛЯ ПК -->
  <script>
    if (!/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) && window.innerWidth > 768) {
      window.location.replace('index.html' + window.location.hash);
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Специфичные стили для мобильного приложения -->
  <style>
    /* Скрываем десктопные элементы */
    .header-actions, .hero-stats, .ambient-glow { display: none !important; }
    
    /* Компактная шапка */
    .header { padding: 10px 16px; position: fixed; width: 100%; z-index: 1000; }
    .hero-section { padding: 80px 16px 40px; }
    .hero-title { font-size: 1.8rem; }
    
    /* Нижнее навигационное меню (App-like) */
    .bottom-app-bar {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      background: rgba(10, 12, 16, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-gold);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 20px 0; /* Отступ для iPhone Home Indicator */
      z-index: 2000;
    }
    .app-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.65rem;
      gap: 4px;
    }
    .app-tab.active, .app-tab:active { color: var(--gold-accent); }
    .app-tab-icon { font-size: 1.4rem; }
    
    /* Отступ снизу, чтобы контент не перекрывался меню */
    body { padding-bottom: 80px; }
    
    /* Адаптация модального окна под экран телефона */
    .modal-dialog {
      width: 100%; height: 100%; max-height: 100vh;
      border-radius: 0; border: none; padding: 20px 16px 90px;
    }
    .dossier-layout { display: flex; flex-direction: column; gap: 20px; }
    .dossier-img-frame { height: 350px; }
    .dossier-name { font-size: 1.5rem; }
  </style>
</head>
<body class="dark-theme">

  <!-- КОМПАКТНАЯ ШАПКА -->
  <header class="header">
    <div class="logo-group">
      <div class="logo-badge">СРМК</div>
      <div class="logo-text">
        <span class="site-title" style="font-size: 0.9rem;">«Быть воином — жить вечно»</span>
      </div>
    </div>
  </header>

  <main>
    <!-- ВВОДНЫЙ ЭКРАН -->
    <section class="hero-section" id="heroIntro">
      <h1 class="hero-title">ОНИ УЧИЛИСЬ ЗДЕСЬ.<br><span class="highlight">ОНИ ШАГНУЛИ В ВЕЧНОСТЬ.</span></h1>
      <p class="hero-subtitle" style="font-size: 0.9rem;">Цифровой мемориал памяти 20 выпускников колледжа.</p>
      <button class="btn btn-primary" style="width: 100%;" id="btnOpenGeneralTour">🎧 Аудиоэкскурсия</button>
    </section>

    <!-- ЗАЛ I: МЕМОРИАЛ -->
    <section id="memorial" class="section">
      <div class="container">
        <h2 class="section-title" style="font-size: 1.5rem; text-align: center;">Мемориал Славы</h2>
        <div class="plaque-view-toggle">
          <button class="plaque-toggle-btn active" data-plaque-view="left">Левая плита</button>
          <button class="plaque-toggle-btn" data-plaque-view="right">Правая плита</button>
        </div>
        <div class="memorial-stand-container" style="padding: 10px;">
          <div class="plaque-interactive-zone left-zone" id="leftPlaqueZone" style="width: 100%;">
            <div class="names-list" id="leftPlaqueNames"></div>
          </div>
          <div class="plaque-interactive-zone right-zone" id="rightPlaqueZone" style="width: 100%; display: none;">
            <div class="names-list" id="rightPlaqueNames"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ЗАЛ II: КАРТОЧКИ -->
    <section id="heroes-grid" class="section">
      <div class="container">
        <h2 class="section-title" style="font-size: 1.5rem; text-align: center;">За партой Героя</h2>
        <input type="text" id="heroSearchInput" class="search-input" placeholder="Поиск героя..." style="margin-bottom: 16px;">
        <div class="specialty-filters-bar" id="specialtyFiltersContainer"></div>
        <div class="heroes-grid" id="heroesCardsContainer" style="grid-template-columns: 1fr;"></div>
      </div>
    </section>

    <!-- ЗАЛ III: КАРТА -->
    <section id="battle-path" class="section">
      <div class="container">
        <h2 class="section-title" style="font-size: 1.5rem; text-align: center;">Карта боев</h2>
        <div id="interactiveBattleMap" class="battle-map-wrapper" style="height: 400px;"></div>
      </div>
    </section>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО ДОСЬЕ -->
  <div class="modal" id="heroModal">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-dialog">
      <button class="modal-close" id="modalCloseBtn">&times;</button>
      <div class="modal-body" id="modalHeroContent"></div>
    </div>
  </div>

  <!-- АУДИОПЛЕЕР (Скрытый, всплывает над нижним меню) -->
  <div class="audio-bar" id="audioPlayerBar" style="bottom: 65px;">
    <div class="container audio-bar-inner" style="flex-direction: row;">
      <button class="audio-btn" id="audioPlayPauseBtn">▶</button>
      <div class="audio-titles" style="flex-grow: 1; overflow: hidden;">
        <span class="audio-track-title" id="audioTrackTitle" style="white-space: nowrap;">Аудиогид</span>
        <span class="audio-hero-name" id="audioHeroName" style="white-space: nowrap;">СРМК</span>
      </div>
      <button class="audio-close" id="audioCloseBtn">&times;</button>
    </div>
    <audio id="mainAudioElement"></audio>
    <div class="audio-progress-container" id="audioProgressContainer" style="position: absolute; top: 0; left: 0; width: 100%; height: 3px;">
      <div class="audio-progress" id="audioProgressBar"></div>
    </div>
  </div>

  <!-- НИЖНЕЕ НАВИГАЦИОННОЕ МЕНЮ (APP TAB BAR) -->
  <nav class="bottom-app-bar">
    <a href="#memorial" class="app-tab active" onclick="setActiveTab(this)">
      <span class="app-tab-icon">🏛</span>
      <span>Мемориал</span>
    </a>
    <a href="#heroes-grid" class="app-tab" onclick="setActiveTab(this)">
      <span class="app-tab-icon">🎓</span>
      <span>Герои</span>
    </a>
    <a href="#battle-path" class="app-tab" onclick="setActiveTab(this)">
      <span class="app-tab-icon">🗺️</span>
      <span>Карта</span>
    </a>
    <a href="https://карта-доблести.рф" target="_blank" class="app-tab">
      <span class="app-tab-icon">★</span>
      <span>Проект</span>
    </a>
  </nav>

  <!-- СКРИПТЫ -->
  <script src="https://api-maps.yandex.ru/2.1/?apikey=ваш_бесплатный_ключ&lang=ru_RU" type="text/javascript"></script>
  <script src="js/data.js"></script>
  <script src="js/sources.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    // Логика переключения активной вкладки в нижнем меню
    function setActiveTab(element) {
      document.querySelectorAll('.app-tab').forEach(tab => tab.classList.remove('active'));
      element.classList.add('active');
    }

    // Логика переключения плит на мобильном (т.к. обе не влезают)
    document.querySelectorAll('.plaque-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.plaque-toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const view = btn.dataset.plaqueView;
        document.getElementById('leftPlaqueZone').style.display = view === 'left' ? 'block' : 'none';
        document.getElementById('rightPlaqueZone').style.display = view === 'right' ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
